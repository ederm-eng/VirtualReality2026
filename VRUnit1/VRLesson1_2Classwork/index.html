<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position = "-3 .5 -3" rotation="0 45 0" color="tan"> </a-box>
      <a-box position = "-3 1.5 -3." rotation="0 90 0" color="tan"> </a-box>
      <a-box position = "-3.5 1.5 -5" color="tan" > </a-box>
      <a-box position="-3.5 0.5 -5" rotation="0 45 0" color="tan"></a-box>
      <a-sphere position="3.75 1.25 -5" radius="1.15" color="#EF2D5E"></a-sphere>
      <a-sphere position="2.5 2 -8" radius="2" color="Hotpink"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-cylinder position="3 0.5 -3" radius="1" height="1" color="Darkblue" > </a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="Lightblue"></a-sky>
    </a-scene>
  </body>
</html>
